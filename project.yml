name: VaultPony
options:
  bundleIdPrefix: dev.norsehorse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    # build-core.sh shells out to cargo/xcodebuild and touches paths outside
    # the declared script inputs; the default sandbox blocks that.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: 4AVJZV35G8

aggregateTargets:
  VaultFFIBuild:
    buildScripts:
      - name: "Build VaultPonyCore (Rust) + generate bindings"
        script: |
          "${SRCROOT}/scripts/build-core.sh"
        outputFiles:
          - "${SRCROOT}/Generated/VaultFFI.xcframework"
          - "${SRCROOT}/Generated/bindings/vault_ffi.swift"

targets:
  VaultPony:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPony
      - path: Generated/bindings
        name: Generated
    info:
      path: VaultPony/Info.plist
      properties:
        CFBundleDisplayName: VaultPony
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - ru
          - pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "VaultPony uses Face ID to unlock vaults you've enrolled for biometric access."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.vaultpony
        PRODUCT_NAME: VaultPony
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VaultFFIBuild
      - framework: Generated/VaultFFI.xcframework
        embed: false

  VaultPonyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyTests
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: VaultPony

  VaultPonyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyUITests
    dependencies:
      - target: VaultPony

schemes:
  VaultPony:
    build:
      targets:
        VaultPony: all
        VaultPonyTests: [test]
        VaultPonyUITests: [test]
    test:
      targets:
        - VaultPonyTests
    run:
      config: Debug
  VaultPonySnapshots:
    build:
      targets:
        VaultPony: all
        VaultPonyUITests: [test]
    test:
      targets:
        - VaultPonyUITests
    run:
      config: Debug

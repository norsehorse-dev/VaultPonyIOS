name: VaultPony
options:
  bundleIdPrefix: dev.norsehorse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    # build-core.sh shells out to cargo/xcodebuild and touches paths outside
    # the declared script inputs; the default sandbox blocks that.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: 4AVJZV35G8
    # One place for the version: the app and both extensions must match.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"

aggregateTargets:
  VaultFFIBuild:
    buildScripts:
      - name: "Build VaultPonyCore (Rust) + generate bindings"
        script: |
          "${SRCROOT}/scripts/build-core.sh"
        outputFiles:
          - "${SRCROOT}/Generated/VaultFFI.xcframework"
          - "${SRCROOT}/Generated/bindings/vault_ffi.swift"

targets:
  VaultPony:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPony
      - path: Shared
      - path: Generated/bindings
        name: Generated
    entitlements:
      path: VaultPony/VaultPony.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.norsehorse.vaultpony
    info:
      path: VaultPony/Info.plist
      properties:
        CFBundleDisplayName: VaultPony
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - ru
          - pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "VaultPony uses Face ID to unlock vaults you've enrolled for biometric access."
        # vaultpony://share?token=<UUID> from the share extension (2.0.0 rc4).
        CFBundleURLTypes:
          - CFBundleURLName: dev.norsehorse.vaultpony
            CFBundleURLSchemes:
              - vaultpony
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.vaultpony
        PRODUCT_NAME: VaultPony
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VaultFFIBuild
      - framework: Generated/VaultFFI.xcframework
        embed: false
      - target: VaultPonyFileProvider
      - target: VaultPonyFileProviderUI
      - target: VaultPonyShare

  # Files access (2.0.0 rc3, plan 4.2): the non-replicated File Provider
  # extension. It links the same core and never sees a password.
  VaultPonyFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyFileProvider
      - path: Shared
      - path: Generated/bindings
        name: Generated
    entitlements:
      path: VaultPonyFileProvider/VaultPonyFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.norsehorse.vaultpony
    info:
      path: VaultPonyFileProvider/Info.plist
      properties:
        CFBundleDisplayName: VaultPony
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: group.dev.norsehorse.vaultpony
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.vaultpony.FileProvider
        PRODUCT_NAME: VaultPonyFileProvider
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: VaultFFIBuild
      - framework: Generated/VaultFFI.xcframework
        embed: false

  # Shown by Files when the vault is no longer unlocked for it: points the
  # user back to VaultPony. No password entry.
  VaultPonyFileProviderUI:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyFileProviderUI
      - path: VaultPony/Resources/Localizable.xcstrings
    entitlements:
      path: VaultPonyFileProviderUI/VaultPonyFileProviderUI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.norsehorse.vaultpony
    info:
      path: VaultPonyFileProviderUI/Info.plist
      properties:
        CFBundleDisplayName: VaultPony
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-actionsui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionFileProviderActions: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.vaultpony.FileProviderUI
        PRODUCT_NAME: VaultPonyFileProviderUI
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

  # Share into a vault (2.0.0 rc4, plan 5.1): stages shared items in the
  # app group and opens the app. Never links the core, never sees a vault.
  VaultPonyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyShare
      - path: Shared/ShareStaging.swift
      - path: VaultPony/Resources/Localizable.xcstrings
    entitlements:
      path: VaultPonyShare/VaultPonyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.norsehorse.vaultpony
    info:
      path: VaultPonyShare/Info.plist
      properties:
        CFBundleDisplayName: VaultPony
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.norsehorse.vaultpony.Share
        PRODUCT_NAME: VaultPonyShare
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

  VaultPonyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyTests
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: VaultPony

  VaultPonyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VaultPonyUITests
    dependencies:
      - target: VaultPony

schemes:
  VaultPony:
    build:
      targets:
        VaultPony: all
        VaultPonyTests: [test]
        VaultPonyUITests: [test]
    test:
      targets:
        - VaultPonyTests
    run:
      config: Debug
  VaultPonySnapshots:
    build:
      targets:
        VaultPony: all
        VaultPonyUITests: [test]
    test:
      targets:
        - VaultPonyUITests
    run:
      config: Debug
